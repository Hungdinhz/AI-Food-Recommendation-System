server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: food-ai-backend

  # Cấu hình PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_food_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  # Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng từ Code Java vào DB
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cấu hình Redis Cache
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms # Timeout kết nối 2 giây

  # Cấu hình Mail (Mock console output cho development)
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Cấu hình AI LLM API (để trống sẽ dùng mock response)
ai:
  api:
    key: ${AI_API_KEY:}
    url: ${AI_API_URL:}

# Cấu hình JWT
app:
  jwtSecret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  jwtExpirationMs: 86400000 # 24 hours
